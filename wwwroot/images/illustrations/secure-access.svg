<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-label="Carte carburant protégée par un bouclier de sécurité">
  <defs>
    <filter id="s" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#021a44" flood-opacity=".35"/></filter>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e7f0ff"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d3a6"/><stop offset="1" stop-color="#14a37f"/></linearGradient>
  </defs>
  <circle cx="240" cy="200" r="170" fill="#fff" opacity=".07"/>
  <circle cx="240" cy="200" r="120" fill="#fff" opacity=".07"/>
  <!-- back card -->
  <g filter="url(#s)" transform="rotate(-14 200 210)" opacity=".55">
    <rect x="90" y="140" width="230" height="140" rx="16" fill="#9ec5fe"/>
  </g>
  <!-- main card -->
  <g filter="url(#s)" transform="rotate(-6 230 220)">
    <rect x="110" y="140" width="250" height="152" rx="18" fill="url(#c)"/>
    <rect x="134" y="170" width="40" height="30" rx="6" fill="#ffd166"/>
    <path d="M147 170v30M161 170v30M134 185h40" stroke="#e0a800" stroke-width="2"/>
    <path d="M318 172 a12 12 0 0 1 0 22 M326 166 a20 20 0 0 1 0 34" fill="none" stroke="#0d6efd" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <rect x="134" y="226" width="160" height="12" rx="6" fill="#0d6efd"/>
    <rect x="134" y="252" width="86" height="9" rx="4.5" fill="#94a3b8"/>
    <text x="338" y="272" font-family="Outfit, sans-serif" font-size="15" font-weight="800" fill="#0d6efd" text-anchor="end">FUEL</text>
  </g>
  <!-- shield -->
  <g filter="url(#s)">
    <path d="M352 196 l52 18 v40 c0 34 -22 58 -52 70 c-30 -12 -52 -36 -52 -70 v-40z" fill="url(#sh)"/>
    <rect x="334" y="250" width="36" height="28" rx="6" fill="#fff"/>
    <path d="M341 250 v-8 a11 11 0 0 1 22 0 v8" fill="none" stroke="#fff" stroke-width="5"/>
    <circle cx="352" cy="262" r="4" fill="#14a37f"/>
    <rect x="350" y="263" width="4" height="8" rx="2" fill="#14a37f"/>
  </g>
  <!-- chip: quota -->
  <g filter="url(#s)">
    <rect x="40" y="70" width="140" height="54" rx="14" fill="#fff"/>
    <circle cx="66" cy="97" r="14" fill="#e7f0ff"/>
    <path d="M60 104 v-10 h7 l5 5 v5z M67 94 v-4 h4" fill="none" stroke="#0d6efd" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="90" y="86" width="64" height="7" rx="3.5" fill="#cbd5e1"/>
    <text x="90" y="113" font-family="Outfit, sans-serif" font-size="14" font-weight="800" fill="#0f172a">120 L</text>
  </g>
  <!-- chip: check -->
  <g filter="url(#s)">
    <rect x="330" y="60" width="110" height="46" rx="14" fill="#fff"/>
    <circle cx="354" cy="83" r="12" fill="#d1fae5"/>
    <path d="M348 83 l4.5 4.5 l8 -9" fill="none" stroke="#14a37f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="374" y="78" width="50" height="9" rx="4.5" fill="#cbd5e1"/>
  </g>
  <circle cx="70" cy="330" r="10" fill="#ffd166"/>
  <circle cx="430" cy="340" r="6" fill="#fff" opacity=".6"/>
</svg>
